name: Security Check

on: [push, pull_request]

# 显式声明最小权限，避免 workflow 获得默认的 write-all 令牌
# 此 workflow 仅做本地只读检查（lint + grep 密钥扫描），无任何写入操作
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Python Syntax Check
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" -not -path "./.git/*" \
            -not -path "./node_modules/*" | while read f; do
            python -m py_compile "$f" || exit 1
          done

      - name: Check Hardcoded Secrets
        run: |
          # 检查源码中是否误提交了真实凭证（排除 .env、虚拟环境、构建产物和 workflow 自身）
          if grep -rE "(glpat-|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)" . \
            --include="*.py" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.sh" \
            --exclude-dir=.venv --exclude-dir=node_modules --exclude-dir=static --exclude-dir=.git --exclude-dir=.github \
            --exclude="*.env*" --exclude="*/.env"; then
            echo "❌ 发现硬编码的敏感信息！"
            exit 1
          fi
          echo "✅ 未发现敏感信息"
