name: CI Pipeline

on:
  push:
    branches: [main, 'release/**']
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # ✅ 正式版: v1.5.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'     # ✅ 预发布版: v1.5.0-beta
      - '[0-9]+.[0-9]+.[0-9]+'        # 兼容无v前缀
      - '[0-9]+.[0-9]+.[0-9]+-*'      # 兼容无v前缀预发布
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.10-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-py3.10-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.5 pip-audit==2.10.1 mypy==1.13.0

      - name: Validate requirements.txt
        run: pip check

      - name: Ruff Lint
        run: ruff check backend/ main.py

      - name: Ruff Format Check
        run: ruff format --check backend/ main.py

      - name: Type Check (mypy)
        run: mypy backend/ main.py

      - name: Security Audit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pip-audit -r requirements.txt || echo "::warning::Known vulnerabilities found, please review"
          else
            pip-audit -r requirements.txt
          fi

  test:
    name: Unit Test (Python ${{ matrix.python }})
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python }}-pip-

      - run: pip install -r requirements.txt pytest==9.1.1 pytest-cov==7.1.0

      - name: Run Unit Tests
        run: python -m pytest backend/tests/ -q --cov=backend --cov-report=term-missing

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
