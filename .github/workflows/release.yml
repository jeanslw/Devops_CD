name: Auto Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: prerelease_check
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|preview)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract current version changelog
        id: extract_changelog
        run: |
          if [ ! -f docs/CHANGELOG.md ]; then
            echo "changelog=⚠️ CHANGELOG.md not found" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          # v2.7.0 -> v2.7, v2.7.0-alpha -> v2.7 (预发布也按主版本聚合)
          MAJOR_MINOR=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+)\.[0-9]+(-.*)?$/v\1/')
          
          CHANGELOG=$(awk -v mm="$MAJOR_MINOR" '
            BEGIN { found=0; output="" }
            /^## v[0-9]+\.[0-9]+\.[0-9]+/ {
              if (found && $0 !~ "^## " mm "\\.") exit
              if ($0 ~ "^## " mm "\\.") { found=1; next }
            }
            found { output = output $0 "\n" }
            END {
              if (output == "") output = "No changelog entries found for " mm
              print output
            }
          ' docs/CHANGELOG.md)

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          update_release_body: true
          update_release_name: true