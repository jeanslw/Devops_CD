# CD Service - 和 PHP Devops-Glue 搭配使用
# 数据库推荐 MySQL / MariaDB
#
# 配置分两层:
#   · 部署层 -- 根目录 .env(数据库 / SECRET_KEY / 镜像仓库凭据 / CI 凭据 / TZ),下面 env_file 注入容器;
#     镜像仓库地址与类型不在此配置:由 Glue 契约端点 GET /api/integration/services/cd 下发(Glue ≥ 2.11).
#   · 业务层 -- config/app.env(超时 / 缓存 TTL / 间隔 / 截断 / 命名空间 / 角色等),随镜像发布;
#   优先级:进程环境变量 > 根 .env > config/app.env > 代码默认值 --
#   临时覆盖业务参数:写进根 .env 或本文件的 environment 即可,无需重建镜像.
#
# 联合部署(Devops_Glue 仓库 docker-compose.yml 里注释掉的 devops-cd 段),
# 本文件独立部署时,仅挂载 SSH known_hosts 持久化卷(配合 read_only 容器加固).

services:
  # 启动前环境变量预检(一次性容器,复用 devops-cd 镜像不增加额外构建):
  # 1) MySQL 模式缺少连接必填项时输出中英双语指引并中止,避免 uvicorn 启动后抛英文连接堆栈;
  # 2) SECRET_KEY 未设置或是公开示例值时对**所有 driver** 中止 -- compose 无条件 read_only,
  #    运行期自动生成 .cd_secret_key 必然写入失败,示例值也会在 crypto.py 启动期被清空后落入同一崩溃.
  env-check:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-cd:latest
    container_name: devops-cd-env-check
    restart: "no"
    entrypoint: ["python", "-c"]
    environment:
      PYTHONIOENCODING: utf-8
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_HOST: ${DB_HOST:-}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
      SECRET_KEY: ${SECRET_KEY:-}
      # SSO / OIDC 预检输入:密钥只在根 .env 维护,这里透传以表明契约.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      CD_OIDC_SECRET: ${CD_OIDC_SECRET:-}
      CD_OIDC_REDIRECT_URI: ${CD_OIDC_REDIRECT_URI:-}
    command:
      - |
        import os, sys
        driver = os.getenv('DB_DRIVER', 'sqlite')
        if driver == 'mysql':
            missing = [n for n in ('DB_HOST', 'DB_USER', 'DB_PASS') if not os.getenv(n)]
            if missing:
                print('[启动中止] DB_DRIVER=mysql 时必须在 .env 配置：' + '、'.join(missing))
                print('[ABORT] DB_DRIVER=mysql requires these .env entries: ' + ', '.join(missing))
                print('           与 Devops-Glue 共用同一个库时，账号口令应与 CI 根 .env 的 DB_USER/DB_PASS 一致；')
                print('           CD 专用库(拆库部署)则使用该库自己的账号口令。')
                print('           When sharing the Glue database, use the same DB_USER/DB_PASS as in the CI root .env;')
                print('           a dedicated CD database (split-DB deploy) uses its own credentials.')
                print('------------------------------------------------------------------------')
                print('请补全 .env 后重新执行 / Fill in .env, then run again: docker compose up -d --build')
                sys.exit(1)
        key = os.getenv('SECRET_KEY', '').strip()
        if not key:
            print('[启动中止] 容器文件系统只读（read_only），必须在 .env 配置 SECRET_KEY（所有数据库模式均必填）：')
            print('[ABORT] read_only container requires SECRET_KEY in .env (for any DB driver; auto-generated .cd_secret_key cannot be written):')
            print('        生成随机密钥 / generate a random key: openssl rand -base64 32')
            print('------------------------------------------------------------------------')
            print('请补全 .env 后重新执行 / Fill in .env, then run again: docker compose up -d --build')
            sys.exit(1)
        if key in {'devops_cd_2026', 'change_me_to_secret'}:
            print('[启动中止] SECRET_KEY 是公开的示例值，运行期会被忽略并触发同样的只读写入失败：')
            print('[ABORT] SECRET_KEY is a public sample value; it is rejected at runtime and falls into the same read-only write failure:')
            print('        请改为随机密钥 / set a random key instead: openssl rand -base64 32')
            print('------------------------------------------------------------------------')
            print('请补全 .env 后重新执行 / Fill in .env, then run again: docker compose up -d --build')
            sys.exit(1)
        def setting(name, default=''):
            v = os.getenv(name)
            if v and v.strip():
                return v.strip()
            for path in ('config/app.env', '/app/config/app.env'):
                try:
                    with open(path, encoding='utf-8') as fh:
                        for line in fh:
                            line = line.split('#', 1)[0].strip()
                            if line.startswith(name + '='):
                                return line.split('=', 1)[1].strip()
                except OSError:
                    continue
            return default
        need = [n for n in ('OIDC_ISSUER', 'CD_OIDC_SECRET', 'CD_OIDC_REDIRECT_URI') if not setting(n)]
        if need:
            print('[启动中止] Devops-Glue 单点登录（唯一登录方式）必须配置：' + ','.join(need))
            print('[ABORT] Devops-Glue single sign-on (the only login method) requires: ' + ', '.join(need))
            print('         OIDC_ISSUER 写 Glue 对外地址（须与 discovery 的 issuer 一致）；其余两项在根 .env。')
            print('         OIDC_ISSUER is Glue\'s public base URL (must match discovery issuer); the other two live in the root .env.')
            print('------------------------------------------------------------------------')
            print('请补全后重新执行 / Fill them in, then run again: docker compose up -d --build')
            sys.exit(1)
        print('[预检通过 / PASS] 启动配置检查完成 / Startup configuration check passed')

  devops-cd:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-cd:latest
    container_name: devops-cd
    depends_on:
      env-check:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PORT: 8081
      # ── 时区 ──
      TZ: ${TZ:-Asia/Shanghai}
      # ── CI API 集成(和 PHP Devops-Glue 搭配时启用)──
      #CI_API_URL: http://devops-glue
      #CI_API_TOKEN: dg_xxx
      # ── SSO / OIDC(唯一登录方式;必填项缺失时 env-check 会中止启动)──
      CD_OIDC_SECRET: ${CD_OIDC_SECRET:-}
      CD_OIDC_REDIRECT_URI: ${CD_OIDC_REDIRECT_URI:-}
    ports:
      - "${CD_BIND_IP:-127.0.0.1}:8081:8081"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # MySQL / MariaDB 模式(推荐)
    # 若使用sqlite,需要配置 DB_DRIVER=sqlite 模式(可选,取消下面注释)
    # environment:
    #   DB_DRIVER: sqlite
    #   DB_PATH: /data/data.db
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 挂整个 home 而非 .cd_service 子目录:命名卷挂到镜像不存在的子目录时初始属主为 root,appuser(uid 1000) 无写权限
      - cd_known_hosts:/home/appuser
      # - config/data:/data:rw      
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, json, urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8081/api/info', timeout=3)); sys.exit(0 if d.get('status')=='running' and d.get('db_connected') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cd_known_hosts:
